# ==========================================
# NextLite Voice V3 - Reverse Proxy & WebSocket Route Config
# ==========================================

upstream control_plane_api {
    server api:3001;
    keepalive 32;
}

upstream pipecat_voice_worker {
    server worker:8000;
    keepalive 32;
}

# 1. HTTP Server - ACME Challenge, Plivo Webhooks/WS & HTTP-to-HTTPS Redirection
server {
    listen 80;
    listen [::]:80;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Telephony Inbound XML Webhooks (Direct HTTP port 80 support for carrier bypass)
    location /plivo/ {
        proxy_pass http://pipecat_voice_worker;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }

    # Pipecat Realtime Voice WebSocket on port 80
    location /ws/ {
        proxy_pass http://pipecat_voice_worker;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Redirect all browser UI and standard requests to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS Production Server
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    # SSL Certificates (Managed by Certbot)
    ssl_certificate /etc/letsencrypt/live/nextlite-voice-prod.indiasouthcentral.cloudapp.azure.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nextlite-voice-prod.indiasouthcentral.cloudapp.azure.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ---------------------------------------------------------
    # Route A: Control Plane API (FastAPI)
    # ---------------------------------------------------------
    location /api/ {
        proxy_pass http://control_plane_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        client_max_body_size 25M;
    }

    # ---------------------------------------------------------
    # Route B: Pipecat Realtime Voice WebSocket (Plivo Media Streams)
    # CRITICAL: proxy_buffering OFF prevents audio latency spikes
    # ---------------------------------------------------------
    location /ws/ {
        proxy_pass http://pipecat_voice_worker;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable all buffering for immediate PCM / mu-law packet forwarding
        proxy_buffering off;
        proxy_request_buffering off;
        
        # 1-hour read/write timeouts to prevent dropping active calls during silent pauses
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ---------------------------------------------------------
    # Route C: Plivo Telephony Inbound XML Webhooks
    # ---------------------------------------------------------
    location /plivo/ {
        proxy_pass http://pipecat_voice_worker;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }

    # ---------------------------------------------------------
    # Route D: Voice Worker Health & Internal Cache Webhooks
    # ---------------------------------------------------------
    location /health {
        proxy_pass http://pipecat_voice_worker/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    location /internal/ {
        proxy_pass http://pipecat_voice_worker;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------------------------------------------------------
    # Route E: Static Asset Caching for Vite Builds
    # ---------------------------------------------------------
    location /assets/ {
        root /var/www/nextlite-web;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # ---------------------------------------------------------
    # Route F: Frontend SPA Fallback (React Router)
    # ---------------------------------------------------------
    location / {
        root /var/www/nextlite-web;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}

