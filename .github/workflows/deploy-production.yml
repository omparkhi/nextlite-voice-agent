name: Deploy Production (Azure VM + GHCR)

on:
  push:
    branches: [main, migration/node-to-python]
    paths:
      - 'apps/**'
      - 'deployment/**'
      - '.github/workflows/deploy-production.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_API: ghcr.io/${{ github.repository }}/nextlite-api
  IMAGE_WORKER: ghcr.io/${{ github.repository }}/nextlite-worker

jobs:
  build-and-push:
    name: Build & Push Docker Images (GHCR)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build & Push Control Plane API
      - name: Build & Push API Image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/api
          file: ./apps/api/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_API }}:latest
            ${{ env.IMAGE_API }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Build & Push Pipecat Voice Worker
      - name: Build & Push Worker Image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/pipecat-worker
          file: ./apps/pipecat-worker/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_WORKER }}:latest
            ${{ env.IMAGE_WORKER }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-vm:
    name: Deploy to Azure VM
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Execute Remote Deployment via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AZURE_VM_HOST || '172.198.153.14' }}
          username: ${{ secrets.AZURE_VM_USERNAME || 'azureuser' }}
          key: ${{ secrets.AZURE_VM_SSH_KEY }}
          passphrase: ${{ secrets.AZURE_VM_PASSPHRASE || '' }}
          script: |
            set -e
            echo "[Deploy] Pulling latest code and configuration for ${{ github.ref_name }}..."
            cd /opt/nextlite
            git fetch origin
            git checkout ${{ github.ref_name }}
            git pull origin ${{ github.ref_name }}

            echo "[Deploy] Building frontend assets..."
            if [ -d "apps/web" ]; then
              cd apps/web
              if command -v pnpm &> /dev/null; then
                pnpm install --frozen-lockfile || pnpm install
                pnpm build
              elif command -v npm &> /dev/null; then
                npm install
                npm run build
              fi
              cd /opt/nextlite
            fi

            echo "[Deploy] Authenticating with GitHub Container Registry..."
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            echo "[Deploy] Pulling fresh container images..."
            docker pull ${{ env.IMAGE_API }}:latest
            docker pull ${{ env.IMAGE_WORKER }}:latest

            echo "[Deploy] Restarting NextLite stack with zero downtime..."
            cd /opt/nextlite/deployment
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            echo "[Deploy] Reloading Nginx..."
            docker compose -f docker-compose.prod.yml exec -T nginx nginx -s reload || true

            echo "[Deploy] Validating container healthchecks..."
            sleep 15
            curl -f http://localhost:3001/api/health || (echo "API Health Check FAILED!" && exit 1)
            curl -f http://localhost:8000/health || (echo "Worker Health Check FAILED!" && exit 1)

            echo "[Deploy] Deployment successfully completed and verified!"
