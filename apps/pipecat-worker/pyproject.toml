[project]
name = "pipecat-worker"
version = "0.2.0"
description = "NextLite Pipecat Realtime Voice Worker (Phase 2: Plivo + Sarvam STT/TTS Pipeline Foundation)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pipecat-ai==1.8.1",
    "sarvamai>=0.1.28",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "websockets>=13.0",
    "pydantic-settings>=2.4.0",
    "python-dotenv>=1.0.0",
    "loguru>=0.7.2",
    "audioop-lts>=0.2.0",
    "soxr>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
